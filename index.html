<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>Город 812 — Ежедневный отчет</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--text:#171717;--muted:#777;--line:#e5e5e2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:560px;margin:auto;padding:18px 16px 34px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-size:20px;font-weight:800;letter-spacing:-.5px}.tag{font-size:12px;color:#666;background:#e9e9e6;border-radius:999px;padding:7px 10px}
h1{font-size:29px;line-height:1.05;margin:0 0 7px;letter-spacing:-1px}.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.section{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:13px;color:#555}
label{display:block;font-size:14px;font-weight:650;margin:13px 0 7px}.field{display:flex;align-items:center;border:1px solid #ddd;border-radius:12px;background:#fafafa;overflow:hidden}
input,select{width:100%;border:0;outline:0;background:transparent;padding:13px 12px;font-size:17px;color:var(--text)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;border:0;border-radius:14px;padding:15px;background:#111;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.secondary{margin-top:9px;background:#e8e8e5;color:#111}
.status{display:none;margin-top:12px;padding:12px;border-radius:12px;font-size:14px;font-weight:650}.ok{background:#e9f6eb;color:#17652b}.err{background:#fae9e9;color:#8b2020}
.small{font-size:12px;color:#888;line-height:1.4;margin-top:10px}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div class="header"><div class="brand">ГОРОД 812</div><div class="tag">Энергетиков 10а</div></div>
<h1>Ежедневный отчет</h1><div class="sub">Заполните показатели смены и отправьте отчет.</div>
<form id="reportForm">
<div class="card"><div class="section">Дата и менеджер</div>
<label>Дата</label><div class="field"><input id="date" type="date" required></div>
<label>Заполнил менеджер</label><div class="field"><select id="manager" required><option value="">Выберите менеджера</option><option>Антонов</option><option>Батенев</option></select></div></div>
<div class="card"><div class="section">Выручка</div><div class="grid">
<div><label>Наличные сумма</label><div class="field"><input id="cash" inputmode="decimal" placeholder="0"></div></div>
<div><label>Безналичный расчет сумма</label><div class="field"><input id="card" inputmode="decimal" placeholder="0"></div></div></div>
<label>Доставка</label><div class="field"><input id="delivery" inputmode="decimal" placeholder="0"></div></div>
<div class="card"><div class="section">Расходы</div>
<label>Аванс/ЗП</label><div class="field"><input id="salary" inputmode="decimal" placeholder="0"></div>
<label>Сырье (чеки)</label><div class="field"><input id="raw" inputmode="decimal" placeholder="0"></div>
<label>Развоз персонала</label><div class="field"><input id="transport" inputmode="decimal" placeholder="0"></div></div>
<button id="send" type="submit">ОТПРАВИТЬ ОТЧЕТ</button>
<button class="secondary" type="button" id="clear">Очистить</button>
<div id="status" class="status"></div>
<div class="small">Данные отправляются в Google Form через подключенный Google Apps Script.</div>
</form></div>
<script>
const API_URL="PASTE_APPS_SCRIPT_WEB_APP_URL_HERE";
const ids=["cash","card","delivery","salary","raw","transport"];
const el=id=>document.getElementById(id);
const num=id=>parseFloat(String(el(id).value).replace(/\s/g,"").replace(",", "."))||0;
el("date").valueAsDate=new Date();
el("reportForm").addEventListener("submit",async e=>{
 e.preventDefault(); const status=el("status"),btn=el("send");
 if(API_URL.includes("PASTE_")){status.className="status err";status.style.display="block";status.textContent="Сначала укажите URL Google Apps Script в файле index.html.";return}
 const payload={date:el("date").value, cash:num("cash"), card:num("card"), delivery:num("delivery"), salary:num("salary"), raw:num("raw"), transport:num("transport"), manager:el("manager").value};
 btn.disabled=true;btn.textContent="ОТПРАВКА…";status.style.display="none";
 try{
   const r=await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
   localStorage.setItem("lastReport",JSON.stringify(payload));
   status.className="status ok";status.style.display="block";status.textContent="✓ Отчет отправлен в Google Forms.";
   setTimeout(()=>{btn.disabled=false;btn.textContent="ОТПРАВИТЬ ОТЧЕТ"},500);
 }catch(err){status.className="status err";status.style.display="block";status.textContent="Не удалось отправить. Проверьте интернет и URL Apps Script.";btn.disabled=false;btn.textContent="ОТПРАВИТЬ ОТЧЕТ";}
});
el("clear").onclick=()=>{if(confirm("Очистить форму?")){el("reportForm").reset();el("date").valueAsDate=new Date();el("status").style.display="none"}};
</script></body></html>
