<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Город 812 — Ежедневный отчет</title>
  <style>
    /* ... стили без изменений ... */
  </style>
</head>
<body>
  <div id="toast" class="toast">Отправка...</div>
  <div class="container">
    <div class="header">
      <h1>ГОРОД 812</h1>
      <p>Энергетиков 10а</p>
    </div>

    <form id="reportForm" action="https://docs.google.com/forms/u/0/d/e/1FAIpQLScdIG-zovGd3BGOv-lXNkofipEhjCzCBx0AxWkyJYu8hNRkeQ/formResponse" method="POST">
      <h2>Дата и менеджер</h2>
      <div class="form-group">
        <label>Дата</label>
        <input type="date" id="dateField" required>
      </div>
      <input type="hidden" id="dateYear" name="entry.139568847_year">
      <input type="hidden" id="dateMonth" name="entry.139568847_month">
      <input type="hidden" id="dateDay" name="entry.139568847_day">

      <div class="form-group">
        <label>Заполнил менеджер</label>
        <select name="entry.1081676025" required>
          <option value="">Выберите менеджера</option>
          <option value="Антонов">Антонов</option>
          <option value="Батенев">Батенев</option>
        </select>
        <input type="hidden" name="entry.1081676025_sentinel" value="">
      </div>

      <h2>Выручка</h2>
      <div class="form-group">
        <label>Наличные сумма</label>
        <input type="number" step="any" name="entry.2142593659" required placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Безналичный расчет сумма</label>
        <input type="number" step="any" name="entry.459974487" required placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Доставка</label>
        <input type="number" step="any" name="entry.269655102" required placeholder="0.00">
      </div>

      <h2>Расходы</h2>
      <div class="form-group">
        <label>Аванс/ЗП</label>
        <input type="number" step="any" name="entry.1099672490" required placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Сырье (чеки)</label>
        <input type="number" step="any" name="entry.1479624012" required placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Развоз персонала</label>
        <input type="number" step="any" name="entry.939032335" required placeholder="0.00">
        <input type="hidden" name="entry.939032335_sentinel" value="">
      </div>

      <div class="btn-group">
        <button type="submit">ОТПРАВИТЬ ОТЧЕТ</button>
        <button type="reset">Очистить</button>
      </div>
    </form>
  </div>

  <script>
    // Автодата и скрытые поля
    const dateField = document.getElementById('dateField');
    dateField.valueAsDate = new Date();

    function updateHiddenDate() {
      const val = dateField.value;
      if (val) {
        const parts = val.split('-');
        document.getElementById('dateYear').value = parts[0];
        document.getElementById('dateMonth').value = parts[1];
        document.getElementById('dateDay').value = parts[2];
      }
    }
    updateHiddenDate();
    dateField.addEventListener('change', updateHiddenDate);
  </script>
</body>
</html>
